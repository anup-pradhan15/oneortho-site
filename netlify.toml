[build]
  publish = "."

[[redirects]]
  from = "/intake"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/intake.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/knee-pain.html"
  to = "/knee-pain"
  status = 301

[[redirects]]
  from = "/hip-pain.html"
  to = "/hip-pain"
  status = 301

[[redirects]]
  from = "/shoulder-pain.html"
  to = "/shoulder-pain"
  status = 301

[[redirects]]
  from = "/knee-replacement.html"
  to = "/knee-replacement"
  status = 301

[[redirects]]
  from = "/hip-replacement.html"
  to = "/hip-replacement"
  status = 301

[[redirects]]
  from = "/rotator-cuff.html"
  to = "/rotator-cuff"
  status = 301

[[redirects]]
  from = "/acl.html"
  to = "/acl"
  status = 301

[[redirects]]
  from = "/meniscus.html"
  to = "/meniscus"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
