<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Labeled hip anatomy</title>
  <desc id="d">Side-ish view of hip socket, femoral head, and labrum labeled</desc>
  <rect width="640" height="420" rx="24" fill="#F3F5F7"/>
  <text x="28" y="42" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#155EEF" letter-spacing="0.08em">HIP — BALL AND SOCKET</text>

  <!-- Pelvis / socket -->
  <path d="M120 80 c60-50 160-40 200 30 10 18 12 40 4 58 -40 20-90 18-130-6 -30-18-50-40-74-82 z" fill="#fff" stroke="#0B0F14" stroke-width="3"/>
  <text x="150" y="115" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#0B0F14">Pelvis</text>
  <text x="150" y="132" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4B5563">(socket / acetabulum)</text>

  <!-- Labrum ring hint -->
  <circle cx="280" cy="175" r="52" fill="none" stroke="#155EEF" stroke-width="8" opacity=".35"/>
  <circle cx="280" cy="175" r="52" fill="none" stroke="#155EEF" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Femoral head -->
  <circle cx="280" cy="175" r="38" fill="#DBEAFE" stroke="#0B0F14" stroke-width="3"/>
  <!-- Neck + shaft -->
  <path d="M300 205 L360 300" stroke="#0B0F14" stroke-width="18" stroke-linecap="round"/>
  <path d="M360 300 L360 380" stroke="#0B0F14" stroke-width="16" stroke-linecap="round"/>
  <path d="M300 205 L360 300 L360 380" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

  <text x="375" y="340" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#0B0F14">Femur</text>
  <text x="375" y="358" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4B5563">(thigh bone)</text>

  <!-- Callouts -->
  <path d="M280 140 L450 90" stroke="#155EEF" stroke-width="1.5"/>
  <circle cx="280" cy="140" r="4" fill="#155EEF"/>
  <rect x="450" y="66" width="160" height="52" rx="8" fill="#fff" stroke="#E5E9EE"/>
  <text x="462" y="88" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#155EEF">Labrum</text>
  <text x="462" y="106" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4B5563">Seal / bumper of socket</text>

  <path d="M280 175 L450 175" stroke="#0B0F14" stroke-width="1.5"/>
  <circle cx="280" cy="175" r="4" fill="#0B0F14"/>
  <rect x="450" y="154" width="160" height="52" rx="8" fill="#fff" stroke="#E5E9EE"/>
  <text x="462" y="176" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0B0F14">Femoral head</text>
  <text x="462" y="194" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4B5563">“Ball” of the hip</text>

  <path d="M250 210 L450 250" stroke="#4B5563" stroke-width="1.5"/>
  <rect x="450" y="232" width="160" height="52" rx="8" fill="#fff" stroke="#E5E9EE"/>
  <text x="462" y="254" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0B0F14">Impingement zone</text>
  <text x="462" y="272" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4B5563">Where bone can pinch</text>

  <text x="28" y="392" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6B7280">Arthroscopy can treat labrum/impingement. Replacement swaps the worn ball-and-socket.</text>
</svg>